            const list = document.getElementById('list');

            function doSearch() {
                try {
                    const val = document.getElementById('inp').value.toLowerCase().trim();
                    
                    if (!val) {
                        list.innerHTML = '<div class="tip">请输入姓名或单位进行查询</div>';
                        return;
                    }

                    const res = data.filter(item => 
                        (item.n && item.n.toLowerCase().includes(val)) || 
                        (item.u && item.u.toLowerCase().includes(val))
                    );

                    if (res.length === 0) {
                        list.innerHTML = '<div class="tip">未找到匹配的结果</div>';
                        return;
                    }
                    
                    let html = '';
                    res.forEach(item => {
                        let targetLink = item.l;
                        let tagName = "🔗 详细资料";
                        
                        if (!targetLink || targetLink.length < 5) {
                            targetLink = `https://www.baidu.com/s?wd=${encodeURIComponent(item.u + " " + item.n)}`;
                            tagName = "🔍 百度搜索";
                        }

                        // 在标准浏览器中，直接使用 a 标签是最简单可靠的方式
                        html += `
                            <a href="${targetLink}" target="_blank" class="card-link">
                                <div class="name">${item.n}</div>
                                <div class="unit">${item.u}</div>
                                <div class="tag ${tagName.includes('百度')?'gray':''}">${tagName}</div>
                            </a>
                        `;
                    });
                    list.innerHTML = html;

                } catch (e) {
                    console.error("脚本错误:", e);
                    list.innerHTML = '<div class="tip" style="color: red;">脚本发生错误，请联系开发者。</div>';
                }
            }

            // 初始化
            window.onload = function() {
                status.innerText = "请在上方输入姓名或单位查询";
            }
